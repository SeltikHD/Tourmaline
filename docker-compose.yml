  #   depends_on:
  #     - postgres
  #     - redis
  #     - vault

  # --- DATABASES & BROKERS ---
  postgres:
    image: postgres:18.6-alpine
    container_name: tourmaline-postgres
    restart: always
    environment:
      POSTGRES_USER: tourmaline
      POSTGRES_PASSWORD: tourmaline_pass
      POSTGRES_DB: tourmaline_db
      PGDATA: /var/lib/postgresql/data/18
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb

  redis:
    image: redis:8-alpine
    container_name: tourmaline-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: tourmaline-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # --- OBSERVABILITY ---
  prometheus:
    image: prom/prometheus:latest
    container_name: tourmaline-prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: tourmaline-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  pgdata:
    driver: local
