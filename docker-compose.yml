services:
  # --- INGRESS & SECRETS ---
  traefik:
    image: traefik:v3.7
    container_name: tourmaline-traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro

  vault:
    image: hashicorp/vault:latest
    container_name: tourmaline-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "tourmaline-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK

  # --- FRONTEND (ENTRY POINT) ---
  # web-frontend:
  #   build:
  #     context: ./apps/web
  #     dockerfile: Dockerfile
  #   container_name: tourmaline-web-frontend
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - NEXT_PUBLIC_API_GATEWAY_URL=http://localhost:8000
  #   depends_on:
  #     - api-gateway

  # # --- CORE GATEWAY & AUTH SERVICES ---
  # api-gateway:
  #   build:
  #     context: ./services/gateway
  #     dockerfile: Dockerfile
  #   container_name: tourmaline-api-gateway
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - AUTH_SERVICE_URL=http://auth-service:50051
  #     - VAULT_ADDR=http://vault:8200
  #   depends_on:
  #     - auth-service
  #     - vault

  # auth-service:
  #   build:
  #     context: ./services/auth
  #     dockerfile: Dockerfile
  #   container_name: tourmaline-auth-service
  #   ports:
  #     - "50051:50051" # gRPC
  #   environment:
  #     - POSTGRES_URI=postgres://tourmaline:tourmaline_pass@postgres:5432/tourmaline_db?sslmode=disable
  #     - REDIS_URI=redis:6379
