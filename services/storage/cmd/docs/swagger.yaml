basePath: /api/v1
definitions:
  main.HealthResponse:
    properties:
      service:
        type: string
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the API documentation for the Storage Service.
  title: Storage Service API
  version: "1.0"
paths:
  /health:
    get:
      consumes:
      - application/json
      description: This endpoint checks the health status of the storage microservice
        and returns a simple JSON response indicating whether the service is operational.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HealthResponse'
      summary: Verify the health of the storage microservice
      tags:
      - System
  /metrics:
    get:
      consumes:
      - application/json
      description: This endpoint exposes Prometheus metrics for monitoring the storage
        microservice. It provides various metrics related to the service's performance
        and health.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Expose Prometheus metrics for monitoring
      tags:
      - Monitoring
swagger: "2.0"
